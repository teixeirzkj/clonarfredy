<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#FFFFFF">
  <title>Setup da Conta · Frédy</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231F5FDB'/%3E%3Cpath d='M9 24l3.4-16H23l-.8 3.6h-6.5l-.6 2.8h5.6l-.7 3.4h-5.6L13 24z' fill='%23FFFFFF'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <button type="button" class="reopen" id="reopen" hidden>
    <img src="fredy-logo-light.png" alt="" width="64" height="24">
    Abrir setup da conta
  </button>

  <div class="overlay" id="overlay">
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="brand-bar">
        <img class="brand-logo" src="fredy-logo-light.png" alt="Frédy" width="80" height="30">
        <span class="brand-tag">Implantação</span>
        <button type="button" class="icon-btn on-brand" id="close" aria-label="Fechar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <div class="modal-scroll" id="modal-scroll">
        <header class="modal-header">
          <span class="login-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          </span>
          <button type="button" class="icon-btn" id="back" aria-label="Voltar aos blocos" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
          </button>
          <div class="modal-heading">
            <h1 id="modal-title">Setup da Conta</h1>
            <p id="modal-subtitle">Escolha o que configurar na conta do cliente</p>
          </div>
        </header>

        <!-- Login -->
        <form class="view login" id="view-login" hidden>
          <label class="field" id="email-field" hidden>
            <span>E-mail</span>
            <input type="email" id="login-email" autocomplete="username">
          </label>
          <label class="field">
            <span id="password-label">Senha de acesso</span>
            <input type="password" id="password" autocomplete="current-password" required>
          </label>
          <p class="form-error" id="login-error" role="alert"></p>
          <button type="submit" class="btn btn-primary btn-block">Entrar</button>
        </form>

        <!-- Token do cliente: fica só na memória da página -->
        <div class="token-bar" id="token-bar" hidden>
          <span class="token-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2L20 3M16 7l3 3M14 9l2 2"/></svg>
          </span>
          <div class="token-main">
            <label class="token-label" for="client-token">Token da conta do cliente</label>
            <div class="input-wrap">
              <input type="password" id="client-token" placeholder="pn_..." autocomplete="off" spellcheck="false">
              <button type="button" class="input-action" id="toggle-token" aria-label="Mostrar token" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <p class="hint">Usado só nesta sessão. Não é salvo nem registrado.</p>
          </div>
          <span class="token-status" id="token-status" data-state="empty" role="status">Não informado</span>
        </div>

        <!-- Grade de blocos -->
        <div class="view" id="view-grid" hidden>
          <div class="search-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input type="search" class="search" id="search" placeholder="Procurar bloco..." aria-label="Procurar bloco">
          </div>
          <div id="sections"></div>
          <p class="empty" id="no-results" hidden>Nenhum bloco encontrado.</p>
        </div>

        <!-- Painel de um bloco -->
        <div class="view" id="view-block" hidden></div>
      </div>
    </section>
  </div>
</body>
</html>
